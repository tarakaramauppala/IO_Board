# Copy to secrets/device_map.yaml (gitignored). Maps a DUT serial to its cloud
# device, so a cloud check-in test (in tests/<use-case>/) can pull the right
# telemetry. Only needed if the product reports to the cloud.
#
# The key is the serial the FIRMWARE reports / the cloud registers under (the same
# value /run-test calls the "DUT serial") — NOT the J-Link probe id. See the
# serial→device aspect in docs/software/* for which serial is authoritative.
devices:
  "SN-000001": { device_id: "<thingsboard-device-uuid>", device_name: "example-0001" }
